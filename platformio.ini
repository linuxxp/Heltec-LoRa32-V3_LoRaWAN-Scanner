; PlatformIO Project Configuration File
; LoRaWAN Signal Scanner for Heltec LoRa32 V3
;
; Build: pio run
; Upload: pio run --target upload
; Monitor: pio device monitor

[env:heltec_lora32_v3]
platform = espressif32
board = heltec_wifi_lora_32_V3
framework = arduino

; Serial monitor
monitor_speed = 115200
monitor_filters = esp32_exception_decoder, colorize
monitor_rts = 0
monitor_dtr = 0

; Build flags
build_flags =
    ; Note: Heltec V3 uses CP2102 USB-UART, NOT native USB CDC
    -D CORE_DEBUG_LEVEL=3
    ; Heltec LoRa32 V3 specific
    -D HELTEC_BOARD=1
    -D SLOW_CLK_TPYE=1
    ; LoRa SX1262 pins (Heltec V3)
    -D LORA_NSS=8
    -D LORA_SCK=9
    -D LORA_MOSI=10
    -D LORA_MISO=11
    -D LORA_RST=12
    -D LORA_BUSY=13
    -D LORA_DIO1=14
    ; OLED Display pins (Heltec V3)
    -D OLED_SDA=17
    -D OLED_SCL=18
    -D OLED_RST=21
    ; Battery ADC
    -D VBAT_ADC=1
    -D VBAT_CTRL=37
    ; User button
    -D USER_BUTTON=0
    ; White LED
    -D LED_PIN=35
    ; Vext control (for GPS power)
    -D VEXT_CTRL=36

; Libraries
lib_deps =
    ; LoRaWAN stack
    jgromes/RadioLib@^6.6.0
    ; GPS parsing
    mikalhart/TinyGPSPlus@^1.0.3
    ; OLED Display
    olikraus/U8g2@^2.35.9
    ; QR Code generation
    ricmoo/QRCode@^0.0.1

; Partition scheme with more program space
board_build.partitions = min_spiffs.csv

; Upload settings
upload_speed = 921600
